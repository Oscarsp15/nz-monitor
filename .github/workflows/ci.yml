# CI: lo mismo que exige AGENTS.md §10, pero sin depender de que alguien se acuerde de correrlo.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Un PR que recibe varios push seguidos cancela las ejecuciones viejas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff
      - name: Lint (ruff)
        # Los archivos con deuda previa están listados aquí a propósito: se van quitando de la
        # lista conforme se limpian, y ninguno NUEVO puede entrar.
        run: |
          ruff check backend tests \
            --exclude backend/netezza/queries.py \
            --exclude backend/netezza/service.py \
            --exclude backend/netezza/connection.py \
            --exclude backend/_run_local.py
      - name: Tests
        # Los marcados `live` tocan Netezza real: no corren en CI (AGENTS §10).
        run: pytest -q -m "not live"

  frontend:
    name: Frontend (tsc + eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  secretos:
    name: Sin secretos versionados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ningún .env versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.env\.(local|prod|production)$'; then
            echo "::error::Hay un .env versionado. Solo .env.example puede estar en el repo."
            exit 1
          fi
      - name: Ni claves ni contraseñas en el código
        run: |
          patron='(SECRET_KEY|PASSWORD|TOKEN|API_KEY)[[:space:]]*[=:][[:space:]]*["'"'"'][^"'"'"'$<{ ]{12,}'
          # `ci:secreto-publico` marca valores que están en el código a propósito (p. ej. el
          # default de SECRET_KEY, que hace fallar el arranque justamente para que se cambie).
          hallazgos=$(git grep -nIE "$patron" -- . ':!*.example' ':!.github/workflows/*' ':!tests/*'                       | grep -v 'ci:secreto-publico' || true)
          if [ -n "$hallazgos" ]; then
            echo "$hallazgos"
            echo "::error::Posible secreto en el código. Debe ir al .env (que no se versiona)."
            exit 1
          fi

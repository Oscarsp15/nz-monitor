# Uso:
#   docker compose up --build                  -> backend + collector + frontend + nginx
#   docker compose --profile scale up --build  -> + redis (solo al escalar)
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - APP_ROLE=api          # la API NO arranca el recolector
    volumes:
      - ./backend/data:/app/data
    depends_on: [collector]
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      # Si no arranca (p. ej. sin SECRET_KEY), que se note aquí y no en la pantalla del usuario.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  collector:
    build: ./backend
    env_file: .env
    environment:
      - APP_ROLE=collector    # proceso ÚNICO del recolector (APScheduler)
    command: ["python", "-m", "collector"]
    volumes:
      - ./backend/data:/app/data   # comparte el SQLite con la API
    restart: unless-stopped
    # IMPORTANTE: una sola réplica. Dos recolectores = el doble de golpes a Netezza (AGENTS §4).
    # `deploy.replicas` solo lo respeta Swarm; fuera de Swarm lo que hay que evitar es
    # `docker compose up --scale collector=N`. Se deja declarado como intención explícita.
    deploy:
      replicas: 1

  frontend:
    build: ./frontend
    expose: ["80"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy   # no servir la web antes de que la API responda
      frontend:
        condition: service_started

  # ─── Opcional: solo con --profile scale ───
  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # caché efímero
